site_name: hwpkit
# Google shows about 155 characters; this is the fallback description for any
# page without its own front matter, so it has to fit too.
site_description: >-
  Read, edit and extract text from Korean HWP and HWPX files in pure Python.
  No Hancom, no Windows. Fill forms, insert seals, feed Korean docs to a model.
site_url: https://hwpkit.ebenworks.co/
site_author: Ebenworks

repo_url: https://github.com/psychofict/hwpkit
repo_name: psychofict/hwpkit
edit_uri: edit/main/docs/
# Material prints this in the footer of every page as raw HTML, so the links are visible site-wide.
copyright: 'Made by <a href="https://ebenworks.co/">Ebenworks</a> · <a href="https://ebenworks.co/about">About Ebenworks</a> · MIT licensed'

# MkDocs skips every file or folder whose name starts with a dot unless told otherwise.
# /.well-known/ai.txt has to be published, so the dot rule stays and that folder is let back in.
exclude_docs: |
  .*
  !/.well-known/
  /templates/

# Build-time helpers: the home FAQ's structured data, last-edited dates and /feed.xml.
hooks:
  - hooks/geo.py

theme:
  name: material
  # Adds Open Graph, Twitter cards and JSON-LD, which Material's base template
  # does not emit. See overrides/main.html.
  custom_dir: overrides
  # hwpkit's own mark (the document icon from assets/logo.jpeg), not Material's generic book.
  favicon: assets/images/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - hwpkit vs alternatives: comparison.md
  - Blog: blog/index.md
  - API reference: api.md
  - Internals:
    - Object model (HWP ↔ HWPX): OBJECT_MODEL.md
    - Binary record format: RECORD_FORMAT.md
    - Gotchas: GOTCHAS.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]

plugins:
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: optional
      archive: false
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psychofict/hwpkit
      name: hwpkit on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hwpkit/
      name: hwpkit on PyPI
    # The maintainer's accounts (EBE-293, 9 October 2026), the same three every
    # Ebenworks site's "Find us" row carries.
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/ebenworks
      name: Ebenworks on LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/ebenworks.co/
      name: Ebenworks on Instagram
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/channel/UChUx7mbGTtumVd1VIaF4i5w
      name: Ebenworks on YouTube
