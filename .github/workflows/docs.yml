name: Docs

# Builds the MkDocs Material site and deploys it to GitHub Pages (gh-pages
# branch). The CNAME file in docs/ pins the custom domain (hwpkit.ebenworks.co).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[full]            # so mkdocstrings can import the package
          pip install -r docs/requirements.txt
      - name: Build & deploy
        run: mkdocs gh-deploy --force
