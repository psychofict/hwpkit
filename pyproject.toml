[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpkit"
version = "1.0.0"
description = "Read, edit & extract text from Korean HWP & HWPX (Hancom Office / 한글) files in pure Python — no Hancom, no Windows. Fill forms, insert seals/signatures, and feed Korean documents to LLM/RAG pipelines."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "psychofict" }]
requires-python = ">=3.9"
dependencies = ["olefile>=0.46"]
keywords = [
    "hwp", "hwpx", "hancom", "hancom-office", "hangul", "korean",
    "hwp5", "owpml", "hwp-python", "read-hwp", "parse-hwp", "hwp-parser",
    "hwp-to-text", "extract-text", "text-extraction", "document-processing",
    "rag", "llm", "retrieval", "embeddings", "korean-nlp", "nlp",
    "form-automation", "form-filling", "rpa", "e-government",
    "office", "compound-file", "ole", "cfb", "seal", "signature",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
hwpx = ["lxml>=4.6"]                  # .hwpx (OWPML) text extraction
image = ["Pillow>=9.0"]              # place_image (seal / signature insertion)
full = ["lxml>=4.6", "Pillow>=9.0"]

[project.urls]
Homepage = "https://hwpkit.ebenworks.co/"
Documentation = "https://hwpkit.ebenworks.co/"
Repository = "https://github.com/psychofict/hwpkit"
Changelog = "https://hwpkit.ebenworks.co/changelog/"
Issues = "https://github.com/psychofict/hwpkit/issues"
Author = "https://ebenworks.co/"

[project.scripts]
hwpkit-inspect = "hwpkit.inspect:main"
hwpkit-text = "hwpkit.extract:main"

[tool.setuptools.packages.find]
include = ["hwpkit*"]
exclude = ["tests*", "examples*"]
